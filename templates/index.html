<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fafafa;
            color: #222;
        }

        .container {
            width: min(900px, 92%);
            margin: 90px auto 50px;
        }

        h1 {
            text-align: center;
            color: #f97316;
            font-size: 42px;
            margin-bottom: 28px;
        }

        form {
            display: flex;
            max-width: 650px;
            margin: 0 auto 45px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 7px 0 0 7px;
            outline: none;
        }

        input:focus {
            border-color: #f97316;
        }

        button {
            padding: 14px 22px;
            border: none;
            background: #f97316;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 0 7px 7px 0;
        }

        button:hover {
            background: #ea580c;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .info {
            padding: 12px;
            font-size: 14px;
        }

        .score {
            color: #666;
        }

        .ocr {
            margin-top: 6px;
            color: #444;
        }

        .empty {
            text-align: center;
            color: #777;
        }

        @media (max-width: 500px) {
            .container {
                margin-top: 50px;
            }

            h1 {
                font-size: 32px;
            }

            form {
                flex-direction: column;
            }

            input,
            button {
                border-radius: 7px;
            }

            button {
                margin-top: 8px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Search Through Your Images</h1>

        <form action="/search" method="POST">
            <input
                type="text"
                name="query"
                placeholder="Search your images..."
                value="{{ query | default('') }}"
                required
            >
            <button type="submit">Search</button>
        </form>

        {% if results %}
            <div class="results">
                {% for item in results %}
                    <div class="card">
                        <img src="/images/{{ item.path }}" alt="Search result">

                        <div class="info">
                            <div class="score">
                                Score: {{ "%.4f"|format(item.score) }}
                            </div>

                            {% if item.ocr_text %}
                                <div class="ocr">
                                    {{ item.ocr_text | join(', ') }}
                                </div>
                            {% endif %}
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="empty">Search your images to see results.</p>
        {% endif %}

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #181818;
            color: #eee;
        }

        .container {
            width: min(900px, 92%);
            margin: 90px auto 50px;
        }

        h1 {
            text-align: center;
            color: #ff7518;
            font-size: 42px;
            margin-bottom: 28px;
        }

        /* Settings button */
        .settings-btn {
            position: fixed;
            top: 20px;
            right: 24px;
            padding: 9px 15px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #242424;
            color: #ddd;
            cursor: pointer;
            font-size: 14px;
        }

        .settings-btn:hover {
            background: #2d2d2d;
        }

        /* Search */
        form.search-form {
            display: flex;
            max-width: 650px;
            margin: 0 auto 45px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #ddd;
            outline: none;
        }

        .search-input {
            border-radius: 7px 0 0 7px;
        }

        .search-input:focus {
            border-color: #ff7518;
        }

        .search-btn {
            padding: 14px 22px;
            border: none;
            background: #ff7518;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 0 7px 7px 0;
        }

        .search-btn:hover {
            background: #e8660f;
        }

        /* Results */
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .info {
            padding: 12px;
            font-size: 14px;
        }

        .score {
            color: #aaa;
        }

        .ocr {
            margin-top: 6px;
            color: #ddd;
        }

        .empty {
            text-align: center;
            color: #888;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -390px;
            width: 370px;
            max-width: 90%;
            height: 100vh;
            background: #202020;
            border-left: 1px solid #333;
            padding: 25px;
            transition: right 0.25s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 22px;
            color: #ff7518;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 25px;
            cursor: pointer;
        }

        .close-btn:hover {
            color: white;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 7px;
            color: #ddd;
            font-size: 14px;
        }

        .setting-group input,
        .setting-group select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #181818;
            color: #eee;
            outline: none;
        }

        .setting-group input:focus,
        .setting-group select:focus {
            border-color: #ff7518;
        }

        .folder-row {
            display: flex;
            gap: 8px;
        }

        .folder-row input {
            min-width: 0;
        }

        .folder-btn {
            flex-shrink: 0;
            padding: 0 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #292929;
            color: #ddd;
            cursor: pointer;
        }

        .folder-btn:hover {
            background: #333;
        }

        .checkbox-row {
            display: flex !important;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-row input {
            width: auto;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: none;
            border-radius: 6px;
            background: #ff7518;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #e8660f;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 10px 12px;
            border-radius: 6px;
            background-color: #e8f7ee;
            color: #218838;
        }

        .message.error {
            background-color: #fdeaea;
            color: #d93025;
            border: 1px solid #f5c2c0;
        }

        /* Small screens */
        @media (max-width: 500px) {
            .container {
                margin-top: 65px;
            }

            h1 {
                font-size: 32px;
            }

            form.search-form {
                flex-direction: column;
            }

            .search-input,
            .search-btn {
                border-radius: 7px;
            }

            .search-btn {
                margin-top: 8px;
            }

            .settings-btn {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>

<body>

    <button class="settings-btn" onclick="openSettings()">Settings</button>

    <main class="container">

        <h1>Search Through Your Images</h1>

        <form class="search-form" action="/search" method="POST">
            <input
                class="search-input"
                type="text"
                name="query"
                placeholder="Search your images..."
                value="{{ query | default('') }}"
                required
            >
            <button class="search-btn" type="submit">Search</button>
        </form>

        {% if results %}
            <div class="results">
                {% for item in results %}
                    <div class="card">
                        <img src="/view-image?file_path={{ item.path | urlencode }}" alt="Search result">
                        <div class="info">
                            <div class="score">
                                Score: {{ "%.4f"|format(item.score) }}
                            </div>

                            {% if item.ocr_text %}
                                <div class="ocr">
                                    {{ item.ocr_text | join(', ') }}
                                </div>
                            {% endif %}
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="empty">Search your images to see results.</p>
        {% endif %}

    </main>


    <!-- Settings Sidebar -->
    <aside class="sidebar" id="settingsSidebar">

        <div class="sidebar-header">
            <h2>Settings</h2>
            <button class="close-btn" onclick="closeSettings()">&times;</button>
        </div>

        <form id="settingsForm">

            <div class="setting-group">
                <label for="watchFolder">Watch Folder</label>

                <div class="folder-row">
                    <input
                        id="watchFolder"
                        type="text"
                        value="{{ config.path | default('') }}"
                        readonly
                        name="watch_folder"
                    >

                    <button
                        type="button"
                        class="folder-btn"
                        onclick="chooseFolder()"
                    >
                        Choose Folder...
                    </button>
                </div>
            </div>


           



            <div class="setting-group">
                <label for="topK">Top K Results</label>

                <input
                    id="topK"
                    type="number"
                    min="1"
                    value="{{ config.topK | default(5) }}"
                >
            </div>



            <button class="save-btn" type="submit">
                Save Settings
            </button>

            <div id="settingsMessage" class="message"></div>

        </form>

    </aside>


    <script>
        const sidebar = document.getElementById("settingsSidebar");
        const settingsForm = document.getElementById("settingsForm");
        const message = document.getElementById("settingsMessage");


        function openSettings() {
            sidebar.classList.add("open");
        }


        function closeSettings() {
            sidebar.classList.remove("open");
        }


        async function chooseFolder() {
            try {
                const response = await fetch("/api/pick-folder");
                const data = await response.json();

                if (data.status === "success") {
                    document.getElementById("watchFolder").value = data.folder;
                }
            } catch (error) {
                showMessage("Could not choose folder.", true);
            }
        }


        settingsForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const formData = new FormData();

            formData.append(
                "watch_folder",
                document.getElementById("watchFolder").value
            );



            formData.append(
                "topK",
                parseInt(document.getElementById("topK").value, 10)
            );


            try {
                const response = await fetch("/api/settings", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (data.status === "success") {
                    showMessage(data.message);
                } else {
                    showMessage(data.message || "Failed to save settings.", true);
                }

            } catch (error) {
                showMessage("Failed to save settings.", true);
            }
        });


        function showMessage(text, error = false) {
            message.textContent = text;
            message.classList.toggle("error", error);
            message.style.display = "block";

            setTimeout(() => {
                message.style.display = "none";
            }, 3000);
        }
    </script>

</body>
</html>
